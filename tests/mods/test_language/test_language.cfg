// Languages: translations of mod strings per player, getLanguage(), font sets (cl_fontSet) - bots, hud, prints
// Run with VS Code launch "Win tests" or tools/test/select_test_mod.ps1
// Languages: start the game with +set loc_language 14 (czech), 1 (french), 6 (russian), ... (CoD2x language IWD)
set developer 2
set developer_script 1
set logfile 2
set g_log games_mp.log
set g_logSync 1
set debug 1
set sv_maxclients 16
set loc_warnings 1
set g_gametype test_language

// Font sets: F5 = CoD4 fonts, F6 = fonts of the game (vid_restart is done automatically)
bind F5 "set cl_fontSet cod4"
bind F6 "set cl_fontSet original"

devmap mp_toujane
