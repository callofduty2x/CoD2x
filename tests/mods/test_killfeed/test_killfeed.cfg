// Killfeed: obituary icons, cg_gameMessage* cvars - bots, auto-run cases
// Run with VS Code launch "Win tests" or tools/test/select_test_mod.ps1
// Strict mode: all script debugging on (asserts, debug prints), a script error stops the server with its call stack
// (the manual cases x1, x2 do that on purpose - set developer_script 0 to keep the server running after them)
set developer 2
set developer_script 1
set logfile 2
set g_log games_mp.log
set g_logSync 1
set debug 1
set sv_maxclients 16
set sv_wallbang 1
set g_gametype test_killfeed
devmap mp_toujane
