name: Release

# A release is triggered by pushing a version TAG (never by a commit):
#     git tag v1.4.6.9         && git push origin v1.4.6.9         # final release
#     git tag v1.4.6.9-test.1  && git push origin v1.4.6.9-test.1  # pre-release (test)
# The "Version x" commit is only a marker; it does NOT release. External users can't push tags,
# so they can't release. Builds come from the shared build.yml (same pipeline as PR/CI builds).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v1.4.6.9 -> 1.4.6.9

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      publish: true
