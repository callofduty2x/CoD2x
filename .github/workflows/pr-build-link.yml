name: PR build link

# Posts (and keeps updated) a single comment on a PR linking to the downloadable test builds.
# Runs AFTER the CI workflow via workflow_run, so it executes in the base-repo context with write
# permission even for fork PRs — and it never checks out or runs the PR's code, so it's safe.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    # Only for PR-triggered CI runs that succeeded (artifacts exist to download).
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get PR number from the CI run
        uses: actions/download-artifact@v4
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: pr
        run: echo "number=$(cat pr-number.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) return;
            const run = context.payload.workflow_run;
            const url = `${run.html_url}#artifacts`;
            const marker = '<!-- ci-build-link -->';
            const body = `${marker}\n🔨 **Test builds for the latest commit are ready** — [download from the run artifacts](${url}) (sign in to GitHub). The binaries are version-stamped \`…-pr.${prNumber}\`.`;
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
